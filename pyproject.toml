[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[project]
name = "mnist"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "menghor-thuo", email = "thuomenghor@gmail.com" }
]


requires-python = ">=3.13"
dependencies = [
    "gdown>=6.4.0",
    "matplotlib>=3.11.2",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "typer>=0.27.2",
]

[project.scripts]
mnist = "mnist:main"

[dependency-groups]
dev = [
    "invoke>=3.0.3",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120
