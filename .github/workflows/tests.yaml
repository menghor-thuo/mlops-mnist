name: "Run tests"

on: 
  push: 
    branches: [ master, main]
  pull_request: 
    branches: [ master, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup uv
      uses: astral-sh/setup-uv@v7
      with: 
        python-version: 3.13

    - name: Install dependecies
      run: | 
        uv sync --dev --locked

    - name: Pull data with DVC
      env: 
        GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
      run: 
        uv run dvc remote modify storage --local gdrive_use_service_account true
        uv run dvc pull

    - name: Test with pytest
      run: | 
        uv run pytest -v

